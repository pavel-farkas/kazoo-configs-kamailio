######## rtpengine module - media proxy / stale-RTP firewall functions ########

# Matches the co-located rtpengine daemon's `listen-ng` in kazoo-docker
# (network_mode: host, bound to loopback since Kamailio and rtpengine share
# the host network namespace).
#!trydef KZ_RTPENGINE_SOCK "udp:127.0.0.1:2223"
#!trydef KZ_RTPENGINE_FLAGS "replace-origin replace-session-connection strict-source"

#!ifndef MOD_rtpengine
loadmodule "rtpengine.so"
#!endif
modparam("rtpengine", "rtpengine_sock", KZ_RTPENGINE_SOCK)

####### rtpengine Logic ########
route[NG_MANAGE]
{
    $var(rtpengine_flags) = KZ_RTPENGINE_FLAGS;

    if (isflagset(FLAG_TRUSTED_SOURCE)) {
        # trusted carrier/interconnect leg: pin to the negotiated endpoint
        # immediately, skip the NAT-friendly learning window
        $var(rtpengine_flags) = $var(rtpengine_flags) + " endpoint-learning=off";
    }

    if (is_method("INVITE") && has_totag() && has_body("application/sdp")) {
        # re-INVITE that may legitimately relocate media (hold/resume,
        # transfer): let the daemon re-learn the endpoint instead of having
        # strict-source drop the new one
        $var(rtpengine_flags) = $var(rtpengine_flags) + " reset";
    }

    rtpengine_manage($var(rtpengine_flags));

    # Tell nat-traversal-role.cfg's route[NAT_SDP] to skip fix_nated_sdp:
    # rtpengine already rewrote origin/connection for this message, running
    # both would corrupt the SDP.
    setflag(FLAG_RTPENGINE_MANAGED);
}

